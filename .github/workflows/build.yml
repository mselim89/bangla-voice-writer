name: Build Bangla Voice Writer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Project Files
      run: |
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/java/com/bangla/voicewriter

        # settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "BanglaVoiceWriter"
        include(":app")
        EOF

        # root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.3.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
        }
        EOF

        # app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.bangla.voicewriter'
            compileSdk 34

            defaultConfig {
                applicationId "com.bangla.voicewriter"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled false
                }
                debug {
                    isDebuggable true
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            buildFeatures {
                compose true
            }
            composeOptions {
                kotlinCompilerExtensionVersion '1.5.11'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.13.1'
            implementation 'androidx.activity:activity-compose:1.9.0'
            implementation platform('androidx.compose:compose-bom:2024.04.01')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-graphics'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.material:material-icons-extended'
        }
        EOF

        # AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <application
                android:label="বাংলা ভয়েস রাইটার"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service
                    android:name=".BanglaIME"
                    android:label="বাংলা ভয়েস কীবোর্ড"
                    android:permission="android.permission.BIND_INPUT_METHOD"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.view.InputMethod" />
                    </intent-filter>
                    <meta-data
                        android:name="android.view.im"
                        android:resource="@xml/method" />
                </service>
            </application>
        </manifest>
        EOF

        # res/xml/method.xml
        cat << 'EOF' > app/src/main/res/xml/method.xml
        <?xml version="1.0" encoding="utf-8"?>
        <input-method xmlns:android="http://schemas.android.com/apk/res/android">
            <subtype android:label="বাংলা" android:imeSubtypeLocale="bn_BD" android:imeSubtypeMode="keyboard" />
        </input-method>
        EOF

        # MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/bangla/voicewriter/MainActivity.kt
        package com.bangla.voicewriter

        import android.Manifest
        import android.content.ClipData
        import android.content.ClipboardManager
        import android.content.Context
        import android.content.Intent
        import android.os.Bundle
        import android.speech.RecognitionListener
        import android.speech.RecognizerIntent
        import android.speech.SpeechRecognizer
        import android.widget.Toast
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.compose.foundation.background
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.ContentCopy
        import androidx.compose.material.icons.filled.Mic
        import androidx.compose.material.icons.filled.Stop
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp

        class MainActivity : ComponentActivity() {
            private val reqPerm = registerForActivityResult(ActivityResultContracts.RequestPermission()) {}

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                reqPerm.launch(Manifest.permission.RECORD_AUDIO)

                val recognizer = SpeechRecognizer.createSpeechRecognizer(this)

                setContent {
                    var text by remember { mutableStateOf("মাইক্রোফোনে চাপ দিয়ে কথা বলুন") }
                    var isListening by remember { mutableStateOf(false) }

                    DisposableEffect(Unit) {
                        recognizer.setRecognitionListener(object : RecognitionListener {
                            override fun onReadyForSpeech(p: Bundle?) { isListening = true }
                            override fun onEndOfSpeech() { isListening = false }
                            override fun onError(e: Int) { isListening = false; text = "ত্রুটি হয়েছে (কোড: $e)" }
                            override fun onResults(r: Bundle?) {
                                isListening = false
                                text = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: text
                            }
                            override fun onBeginningOfSpeech() {}
                            override fun onRmsChanged(r: Float) {}
                            override fun onBufferReceived(b: ByteArray?) {}
                            override fun onPartialResults(p: Bundle?) {
                                val partial = p?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                                if (!partial.isNullOrBlank()) text = partial
                            }
                            override fun onEvent(t: Int, p: Bundle?) {}
                        })
                        onDispose { recognizer.destroy() }
                    }

                    MaterialTheme {
                        Surface(modifier = Modifier.fillMaxSize(), color = Color(0xFF121212)) {
                            Column(
                                modifier = Modifier.fillMaxSize().padding(20.dp),
                                horizontalAlignment = Alignment.CenterVertically,
                                verticalArrangement = Arrangement.Center
                            ) {
                                Text("বাংলা ভয়েস রাইটার", fontSize = 24.sp, color = Color.White)
                                Spacer(modifier = Modifier.height(20.dp))

                                Card(
                                    modifier = Modifier.fillMaxWidth().heightIn(min = 120.dp),
                                    shape = RoundedCornerShape(12.dp),
                                    colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))
                                ) {
                                    Column(modifier = Modifier.padding(16.dp)) {
                                        Text(text, fontSize = 18.sp, color = Color.White)
                                    }
                                }

                                Spacer(modifier = Modifier.height(30.dp))

                                Button(
                                    onClick = {
                                        if (isListening) {
                                            recognizer.stopListening()
                                            isListening = false
                                        } else {
                                            val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                                                putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                                                putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD")
                                                putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                                            }
                                            recognizer.startListening(intent)
                                        }
                                    },
                                    modifier = Modifier.size(90.dp),
                                    shape = CircleShape,
                                    colors = ButtonDefaults.buttonColors(containerColor = if (isListening) Color(0xFFD32F2F) else Color(0xFF00897B))
                                ) {
                                    Icon(if (isListening) Icons.Default.Stop else Icons.Default.Mic, contentDescription = null, modifier = Modifier.size(44.dp), tint = Color.White)
                                }

                                Spacer(modifier = Modifier.height(20.dp))

                                OutlinedButton(onClick = {
                                    val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                    clipboard.setPrimaryClip(ClipData.newPlainText("BanglaText", text))
                                    Toast.makeText(this@MainActivity, "কপি করা হয়েছে!", Toast.LENGTH_SHORT).show()
                                }) {
                                    Icon(Icons.Default.ContentCopy, contentDescription = null, modifier = Modifier.size(18.dp))
                                    Spacer(modifier = Modifier.width(6.dp))
                                    Text("টেক্সট কপি করুন")
                                }
                            }
                        }
                    }
                }
            }
        }
        EOF

        # BanglaIME.kt
        cat << 'EOF' > app/src/main/java/com/bangla/voicewriter/BanglaIME.kt
        package com.bangla.voicewriter

        import android.content.Intent
        import android.inputmethodservice.InputMethodService
        import android.os.Bundle
        import android.speech.RecognitionListener
        import android.speech.RecognizerIntent
        import android.speech.SpeechRecognizer
        import android.view.View
        import android.widget.Button
        import android.widget.LinearLayout

        class BanglaIME : InputMethodService() {
            private var recognizer: SpeechRecognizer? = null

            override fun onCreate() {
                super.onCreate()
                recognizer = SpeechRecognizer.createSpeechRecognizer(this)
            }

            override fun onCreateInputView(): View {
                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.HORIZONTAL
                    setPadding(16, 16, 16, 16)
                    setBackgroundColor(0xFF222222.toInt())
                }

                val btn = Button(this).apply {
                    text = "🎤 মুখে বলুন (বাংলা)"
                    setOnClickListener {
                        val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                            putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                            putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD")
                        }
                        recognizer?.setRecognitionListener(object : RecognitionListener {
                            override fun onResults(r: Bundle?) {
                                val text = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                                if (!text.isNullOrBlank()) {
                                    currentInputConnection?.commitText(text + " ", 1)
                                }
                            }
                            override fun onReadyForSpeech(p: Bundle?) {}
                            override fun onBeginningOfSpeech() {}
                            override fun onRmsChanged(r: Float) {}
                            override fun onBufferReceived(b: ByteArray?) {}
                            override fun onEndOfSpeech() {}
                            override fun onError(e: Int) {}
                            override fun onPartialResults(p: Bundle?) {}
                            override fun onEvent(t: Int, p: Bundle?) {}
                        })
                        recognizer?.startListening(intent)
                    }
                }
                layout.addView(btn)
                return layout
            }

            override fun onDestroy() {
                super.onDestroy()
                recognizer?.destroy()
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: BanglaVoiceWriter-APK
        path: app/build/outputs/apk/debug/*.apk
