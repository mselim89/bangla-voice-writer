name: Build Bangla Voice Writer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Project Files
      run: |
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/java/com/bangla/voicewriter

        # 1. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "BanglaVoiceWriter"
        include ':app'
        EOF

        # 2. root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 3. app/build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            namespace 'com.bangla.voicewriter'
            compileSdk 34

            defaultConfig {
                applicationId "com.bangla.voicewriter"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
                debug {
                    debuggable true
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <application
                android:label="বাংলা ভয়েস রাইটার"
                android:supportsRtl="true"
                android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service
                    android:name=".BanglaIME"
                    android:label="বাংলা ভয়েস কীবোর্ড"
                    android:permission="android.permission.BIND_INPUT_METHOD"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.view.InputMethod" />
                    </intent-filter>
                    <meta-data
                        android:name="android.view.im"
                        android:resource="@xml/method" />
                </service>
            </application>
        </manifest>
        EOF

        # 5. res/xml/method.xml
        cat << 'EOF' > app/src/main/res/xml/method.xml
        <?xml version="1.0" encoding="utf-8"?>
        <input-method xmlns:android="http://schemas.android.com/apk/res/android">
            <subtype android:label="বাংলা" android:imeSubtypeLocale="bn_BD" android:imeSubtypeMode="keyboard" />
        </input-method>
        EOF

        # 6. res/values/strings.xml
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">বাংলা ভয়েস রাইটার</string>
        </resources>
        EOF

        # 7. res/layout/activity_main.xml (সুন্দর ক্লিন UI)
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="24dp"
            android:gravity="center"
            android:background="#121212">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="বাংলা ভয়েস রাইটার"
                android:textColor="#FFFFFF"
                android:textSize="24sp"
                android:textStyle="bold"
                android:layout_marginBottom="24dp" />

            <TextView
                android:id="@+id/tvResult"
                android:layout_width="match_parent"
                android:layout_height="160dp"
                android:background="#1E1E1E"
                android:textColor="#FFFFFF"
                android:textSize="18sp"
                android:padding="16dp"
                android:text="কথা বলতে নিচের মাইকে চাপ দিন..." />

            <Button
                android:id="@+id/btnMic"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="32dp"
                android:text="🎤 কথা বলুন (বাংলা)"
                android:textSize="18sp"
                android:padding="16dp"
                android:backgroundTint="#00897B" />

            <Button
                android:id="@+id/btnCopy"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="16dp"
                android:text="টেক্সট কপি করুন"
                android:backgroundTint="#333333" />
        </LinearLayout>
        EOF

        # 8. MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/bangla/voicewriter/MainActivity.kt
        package com.bangla.voicewriter

        import android.Manifest
        import android.content.ClipData
        import android.content.ClipboardManager
        import android.content.Context
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.os.Bundle
        import android.speech.RecognitionListener
        import android.speech.RecognizerIntent
        import android.speech.SpeechRecognizer
        import android.widget.Button
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat

        class MainActivity : AppCompatActivity() {
            private lateinit var recognizer: SpeechRecognizer
            private lateinit var tvResult: TextView
            private lateinit var btnMic: Button
            private var isListening = false

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                tvResult = findViewById(R.id.tvResult)
                btnMic = findViewById(R.id.btnMic)
                val btnCopy: Button = findViewById(R.id.btnCopy)

                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                }

                recognizer = SpeechRecognizer.createSpeechRecognizer(this)
                recognizer.setRecognitionListener(object : RecognitionListener {
                    override fun onReadyForSpeech(params: Bundle?) {
                        tvResult.text = "শুনছি... এখন বাংলায় বলুন"
                    }
                    override fun onResults(results: Bundle?) {
                        val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                        if (!matches.isNullOrEmpty()) {
                            tvResult.text = matches[0]
                        }
                        btnMic.text = "🎤 কথা বলুন (বাংলা)"
                        isListening = false
                    }
                    override fun onError(error: Int) {
                        tvResult.text = "ত্রুটি হয়েছে (কোড: $error)। পুনরায় বলুন।"
                        btnMic.text = "🎤 কথা বলুন (বাংলা)"
                        isListening = false
                    }
                    override fun onBeginningOfSpeech() {}
                    override fun onRmsChanged(rmsdB: Float) {}
                    override fun onBufferReceived(buffer: ByteArray?) {}
                    override fun onEndOfSpeech() {
                        btnMic.text = "🎤 কথা বলুন (বাংলা)"
                        isListening = false
                    }
                    override fun onPartialResults(partialResults: Bundle?) {
                        val matches = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                        if (!matches.isNullOrEmpty()) {
                            tvResult.text = matches[0]
                        }
                    }
                    override fun onEvent(eventType: Int, params: Bundle?) {}
                })

                btnMic.setOnClickListener {
                    if (isListening) {
                        recognizer.stopListening()
                        btnMic.text = "🎤 কথা বলুন (বাংলা)"
                        isListening = false
                    } else {
                        val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                            putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                            putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD")
                            putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                        }
                        recognizer.startListening(intent)
                        btnMic.text = "⏹️ থামাুন"
                        isListening = true
                    }
                }

                btnCopy.setOnClickListener {
                    val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                    clipboard.setPrimaryClip(ClipData.newPlainText("Bangla", tvResult.text))
                    Toast.makeText(this, "কপি করা হয়েছে!", Toast.LENGTH_SHORT).show()
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                recognizer.destroy()
            }
        }
        EOF

        # 9. BanglaIME.kt (সিস্টেম কীবোর্ড)
        cat << 'EOF' > app/src/main/java/com/bangla/voicewriter/BanglaIME.kt
        package com.bangla.voicewriter

        import android.content.Intent
        import android.inputmethodservice.InputMethodService
        import android.os.Bundle
        import android.speech.RecognitionListener
        import android.speech.RecognizerIntent
        import android.speech.SpeechRecognizer
        import android.view.View
        import android.widget.Button
        import android.widget.LinearLayout

        class BanglaIME : InputMethodService() {
            private var recognizer: SpeechRecognizer? = null

            override fun onCreate() {
                super.onCreate()
                recognizer = SpeechRecognizer.createSpeechRecognizer(this)
            }

            override fun onCreateInputView(): View {
                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.HORIZONTAL
                    setPadding(16, 16, 16, 16)
                    setBackgroundColor(0xFF222222.toInt())
                }

                val btn = Button(this).apply {
                    text = "🎤 মুখে বলুন (বাংলা)"
                    setOnClickListener {
                        val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                            putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                            putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD")
                        }
                        recognizer?.setRecognitionListener(object : RecognitionListener {
                            override fun onResults(r: Bundle?) {
                                val text = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                                if (!text.isNullOrBlank()) {
                                    currentInputConnection?.commitText(text + " ", 1)
                                }
                            }
                            override fun onReadyForSpeech(p: Bundle?) {}
                            override fun onBeginningOfSpeech() {}
                            override fun onRmsChanged(r: Float) {}
                            override fun onBufferReceived(b: ByteArray?) {}
                            override fun onEndOfSpeech() {}
                            override fun onError(e: Int) {}
                            override fun onPartialResults(p: Bundle?) {}
                            override fun onEvent(t: Int, p: Bundle?) {}
                        })
                        recognizer?.startListening(intent)
                    }
                }
                layout.addView(btn)
                return layout
            }

            override fun onDestroy() {
                super.onDestroy()
                recognizer?.destroy()
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: BanglaVoiceWriter-APK
        path: app/build/outputs/apk/debug/*.apk
